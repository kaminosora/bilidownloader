<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>下载任务 · Bili 本地下载</title>
    <link rel="stylesheet" href="popup.css">
    <script src="tasks.js" type="module"></script>
  </head>
  <body class="tasks-page">
    <div class="tasks-shell">
      <header class="app-brand"><span class="brand-mark" aria-hidden="true">↓</span><div><strong>Bili 本地下载</strong><small>LOCAL FILES, YOUR CHOICE</small></div><span class="local-tag">任务中心</span></header>
      <main>
        <p class="eyebrow">一切都在这台电脑上</p>
        <h1>你的下载，<br>正在变成文件。</h1>
        <p class="lead">这里汇总所有播放页的任务。关闭面板后仍会继续执行；请保持 Chrome 运行。</p>
        <div class="task-tips"><span aria-hidden="true">↳</span><p>任务按顺序执行。大文件可选「原始轨」，先写浏览器临时存储再保存；请留足磁盘空间与存储配额。中断后可重试，不支持跨浏览器退出的断点续传。</p></div>
        <div id="tasks-root"></div>
      </main>
      <footer>仅在浏览器本地处理 · 文件由 Chrome 下载管理器保存</footer>
    </div>
  </body>
</html>
